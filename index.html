<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070a10">
<meta name="description" content="光 — 빛의 속도가 규칙인 시공간 전략 게임. 당신이 보는 모든 것은 과거이고, 당신의 명령은 미래에 도착한다.">
<title>光</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23070a10'/%3E%3Ctext x='32' y='47' text-anchor='middle' font-size='44' fill='%23f2d59b' font-family='serif'%3E光%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
<header id="hud">
  <div class="brand"><h1>光</h1><span id="mode-name">—</span></div>
  <nav id="views" aria-label="보기">
    <button data-mode="space" title="공간 (1)"><b>1</b>공간</button>
    <button data-mode="time" title="시공간 프리즘 (2 / Space)"><b>2</b>시공간</button>
    <button data-mode="wave" title="파동장 (3)"><b>3</b>파동</button>
  </nav>
  <div class="meters">
    <div class="meter"><small>ROUND</small><output id="round">01/24</output></div>
    <div class="meter"><small>COORDINATE TIME</small><output id="clock">00.00</output></div>
    <div class="meter score"><small>ORIGIN I · ORIGIN II</small><output id="score"><i class="b">0</i><em>:</em><i class="r">0</i></output><span id="score-note"></span></div>
    <button id="menu-btn" class="ghost-btn" title="메뉴 (Esc)">메뉴</button>
  </div>
</header>
<main id="stage">
  <div id="field"></div>
  <section id="objective" hidden></section>
  <section id="orders" aria-label="명령 패킷">
    <div class="eyebrow">TRANSMISSIONS <span id="budget"></span></div>
    <div id="draft-list"></div>
    <p class="hint" id="order-hint"></p>
  </section>
  <aside id="inspector" aria-live="polite"></aside>
  <div id="toast" role="status" hidden></div>
  <div class="cam">
    <button id="cam-top" title="상단 뷰">⊤</button><button id="cam-reset" title="카메라 복귀 (R)">⟲</button><button id="zoom-out" title="축소">−</button><button id="zoom-in" title="확대">+</button>
  </div>
  <div id="legend"></div>
</main>
<footer id="dock">
  <div class="rail">
    <div class="rail-head"><span id="rail-state">현재</span><button id="to-now" class="link">현재로 ↩</button></div>
    <div class="track" id="track">
      <div id="rounds"></div><div id="future-shade"></div><div id="pins"></div><div id="now-line"></div><div id="cursor"></div>
      <input type="range" id="timeline" min="0" max="48" step="0.01" value="0" aria-label="시간 탐색">
    </div>
  </div>
  <div class="transport">
    <button id="rate" class="ghost-btn" title="재생 배속">1×</button>
    <button id="commit" class="commit"><span>송신 · 진행</span><kbd>↵</kbd></button>
  </div>
</footer>
<div id="overlay" hidden></div>
<script type="module" src="./src/ui/app.ts"></script>
</body>
</html>
